name: daisy-example
services:
  web:
    image: ghcr.io/witnium/daisy-example-web@sha256:b9e805c43fbec5762492eedcb96ef26432b010992562c8e110e66595bcc3cb7a
    ports: ["8080"]
    depends_on: [api]
    environment: [EXAMPLE_MESSAGE, API_URL, EXAMPLE_TOKEN, FILES_PATH]
    volumes: ["files:/data"]
    restart: unless-stopped
  api:
    image: ghcr.io/witnium/daisy-example-api@sha256:5461c3530fbd9f810ed3d7690bd990407b19a330c337fb0abb1976ffb6482fb8
    ports: ["8081"]
    depends_on: [postgres]
    environment: [DATABASE_URL, EXAMPLE_TOKEN, FILES_PATH, FAULT_FILL_CAP_BYTES, FAULT_FILL_FLOOR_BYTES]
    volumes: ["files:/data"]
    restart: unless-stopped
  worker:
    image: ghcr.io/witnium/daisy-example-worker@sha256:b4a9b69ddd8a8575ded4a69109a097f45743dfcab541bf554e47804406a43cfe
    ports: ["8082"]
    depends_on: [api, postgres]
    environment: [DATABASE_URL, EXAMPLE_TOKEN, API_URL, FILES_PATH]
    volumes: ["files:/data"]
    restart: unless-stopped
  postgres:
    image: ghcr.io/witnium/daisy-example-postgres@sha256:861cbcfab6b957526634c0311d9fa053e6b74f3886da6a1fe4dbf97c78c842a4
    ports: ["5432"]
    environment: [POSTGRES_PASSWORD]
    volumes: ["database:/var/lib/postgresql/data"]
volumes:
  files: {}
  database: {}
